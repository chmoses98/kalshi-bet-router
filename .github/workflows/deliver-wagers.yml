# Phase 9: deliver eligible wagers to their destination ledger.
#
# SECURITY NOTES (this repository is public):
#   * Scheduled and manually dispatchable, main branch only.
#   * This job holds BOTH credentials -- Kalshi read access to build the payload
#     and DOWNSTREAM_REPO_TOKEN to deliver it. That is unavoidable and is why it
#     is one job: passing a payload between jobs means an artifact, and the
#     payload is the owner's betting activity.
#   * The PAYLOAD IS NEVER PRINTED and never uploaded. It is written to
#     RUNNER_TEMP, consumed by the destination's own importer, and discarded
#     with the runner. Only counts reach this log.
#   * The router NEVER edits a ledger file. It hands a payload to the
#     destination's importer and commits only what that importer produced --
#     bypassing it would bypass its duplicate detection, ticker resolution and
#     validation, which are the properties that make a re-run safe.
#   * The token is supplied to git through a credential helper that reads it
#     from the environment at push time, so it never appears in a URL, in argv,
#     or in .git/config.
name: Deliver wagers downstream

on:
  # PHASE 10: THE CADENCE IS CHOSEN FROM A MEASUREMENT, NOT FROM A PREFERENCE.
  #
  # Run 2 of this workflow walked the account's complete order history --
  # 1756 orders -- and finished the payload build in 5 minutes 19 seconds.
  # So a 5-minute cadence would start each run before the previous one
  # finished, and with cancel-in-progress: false (which is not negotiable,
  # see below) they would queue without bound.
  #
  # 15 minutes gives roughly 3x headroom over the measured run. A wager is
  # recorded within a quarter of an hour of its market closing, and the queue
  # cannot grow. If the walk ever gets materially faster, the cadence can move
  # down -- but it moves on a new measurement, not on an intuition.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and import locally, then discard without pushing"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Never cancel a delivery in flight: cancellation between the destination's
  # commit and this job's receipt would leave a canonical wager written with no
  # record here that it was.
  group: deliver-wagers
  cancel-in-progress: false

jobs:
  deliver:
    name: Deliver eligible wagers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Refuse to run credentialed code from an untrusted ref
        run: |
          # A scheduled run is always on the default branch; this guards the
          # dispatch path, where a ref can be chosen.
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::This credentialed workflow may only run from refs/heads/main (got ${GITHUB_REF})."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install router
        run: python -m pip install --disable-pip-version-check --quiet .

      - name: Build the delivery payload
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/payloads"
          # --allow-stabilization is enabled on measured evidence: every one of
          # the 1755 orders in this account's history finished filling within a
          # single second, against a 900-second window.
          # tee: the report still reaches the log, and the health token is
          # read back out of it rather than recomputed by a second command
          # (which would walk the whole history again to say the same thing).
          python -m kalshi_router.cli deliver \
            --out-dir "${RUNNER_TEMP}/payloads" \
            --allow-stabilization | tee "${RUNNER_TEMP}/report.txt"
          grep -E '^HEALTH=' "${RUNNER_TEMP}/report.txt" >> "${GITHUB_ENV}"

      - name: Deliver each destination
        env:
          DOWNSTREAM_REPO_TOKEN: ${{ secrets.DOWNSTREAM_REPO_TOKEN }}
          # A scheduled run has no inputs, so `inputs.dry_run` is empty there.
          # Empty must NEVER be read as "go ahead and push" by falling through a
          # `!= "true"` test, so the scheduled value is stated explicitly here
          # and anything unreadable is refused below.
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
        run: |
          set -euo pipefail

          case "${DRY_RUN}" in
            true|false) ;;
            *)
              echo "::error::DRY_RUN must be exactly 'true' or 'false' (got '${DRY_RUN}')."
              exit 1
              ;;
          esac

          shopt -s nullglob
          payloads=("${RUNNER_TEMP}"/payloads/*.json)
          if [ ${#payloads[@]} -eq 0 ]; then
            # "No payload" is not a health verdict. It can mean a quiet
            # account OR a wager this system refused to record, and this
            # step cannot tell them apart -- the health annotation below
            # can, and it is the one that says which.
            echo "no payload: nothing was eligible for delivery this run."
            exit 0
          fi

          # Per-destination, so one failing sport cannot roll back another's
          # success. Each destination reports its own outcome.
          failures=0
          for payload in "${payloads[@]}"; do
            sport="$(basename "${payload}" .json)"

            # THE DESTINATION TABLE LIVES IN ONE PLACE, AND IT IS NOT HERE.
            #
            # This used to be a `case` naming MLB, its repository, its importer
            # and its path prefix inline -- so the router knew a destination in
            # four places that could disagree, and adding a sport meant
            # remembering all four. It also could not express a destination
            # whose ledger is on a DATA BRANCH with its importer on `main`,
            # which is why CFB could be delivered by the one-time backfill
            # workflow and not by this one.
            #
            # `kalshi_router.destinations.PROFILES` is the one place now.
            # `scripts/destination_profile.py` is how a shell reads it, and it
            # prints only public facts: a repository, a branch, a prefix, a
            # command template. A sport absent from the table is REFUSED.
            profile_status=0
            repo="$(python "${GITHUB_WORKSPACE}/scripts/destination_profile.py" \
              "${sport}" --field repo)" || profile_status=$?
            if [ "${profile_status}" -ne 0 ] || [ -z "${repo}" ]; then
              echo "::error::${sport} has no destination profile; refusing to guess a repository."
              failures=$((failures + 1))
              continue
            fi
            ledger_branch="$(python "${GITHUB_WORKSPACE}/scripts/destination_profile.py" \
              "${sport}" --field ledger_branch)"
            code_branch="$(python "${GITHUB_WORKSPACE}/scripts/destination_profile.py" \
              "${sport}" --field code_branch)"
            needs_code="$(python "${GITHUB_WORKSPACE}/scripts/destination_profile.py" \
              "${sport}" --field needs_separate_code_checkout)"
            needs_season="$(python "${GITHUB_WORKSPACE}/scripts/destination_profile.py" \
              "${sport}" --field requires_season)"

            echo "=== ${sport} -> ${repo} (${ledger_branch}) ==="

            # THE LEDGER CHECKOUT. Not necessarily `main`: CFB's canonical
            # ledger lives on `accounting-data`, and cloning main there would
            # put the importer's output on a branch that does not hold a
            # ledger.
            work="${RUNNER_TEMP}/dest-${sport}"
            rm -rf "${work}"
            git clone --quiet --depth 1 --branch "${ledger_branch}" \
              "https://github.com/${repo}" "${work}"

            # THE CODE CHECKOUT, when the importer's source is somewhere else.
            # Conflating the two is how a delivery runs an importer that does
            # not exist on the branch it is writing.
            code="${work}"
            if [ "${needs_code}" = "true" ]; then
              code="${RUNNER_TEMP}/code-${sport}"
              rm -rf "${code}"
              git clone --quiet --depth 1 --branch "${code_branch}" \
                "https://github.com/${repo}" "${code}"
            fi

            # THE SEASON, for a ledger that is one file per season. Taken from
            # the CONTEST DATES in the payload rather than from today's clock:
            # a delivery run in January would otherwise file a bowl game under
            # the wrong year. A payload whose dates span two seasons is
            # refused -- splitting it is the right answer and this workflow is
            # not where that decision belongs.
            season=""
            if [ "${needs_season}" = "true" ]; then
              season_status=0
              season="$(python "${GITHUB_WORKSPACE}/scripts/payload_season.py" \
                --payload "${payload}" --sport "${sport}")" || season_status=$?
              if [ "${season_status}" -ne 0 ] || [ -z "${season}" ]; then
                echo "::error::${sport}: the payload's season could not be established; nothing was imported."
                failures=$((failures + 1))
                continue
              fi
              echo "  season ledger: ${season}"
            fi

            # The token reaches git through a helper that reads it from the
            # environment when a push happens. It is not in the URL, not in
            # argv, and not written into .git/config.
            git -C "${work}" config credential.helper \
              '!f() { echo "username=x-access-token"; echo "password=${DOWNSTREAM_REPO_TOKEN}"; }; f'
            git -C "${work}" config user.name "kalshi-bet-router"
            git -C "${work}" config user.email "noreply@users.noreply.github.com"

            base_sha="$(git -C "${work}" rev-parse HEAD)"
            echo "destination ${ledger_branch}: ${base_sha}"

            # ONE LONG-LIVED BRANCH PER SPORT, and one pull request on it.
            #
            # The first version of this derived the branch name from the
            # DESTINATION's HEAD, which moves. Same undelivered wager, two
            # destination commits, two branches -- and because the branch is
            # never merged, every run re-imports as NEW. If the destination had
            # NOT moved it was worse: the same branch name with a different
            # commit, rejected non-fast-forward, red every 15 minutes.
            branch="kalshi-router/${sport}"

            # WHERE THE IMPORTER RUNS IS WHAT MAKES A RE-DELIVERY STABLE.
            #
            # This step used to run the importer on top of bare `main` every
            # time. Seeded there, an undelivered wager is absent, so the
            # importer writes it as NEW -- and the destination stamps every NEW
            # row's createdAt, recordedAt and provenance.ingestedAt with the
            # wall clock. Two runs of the SAME payload on the SAME base
            # therefore produced two different trees (measured 2026-09-19:
            # a9591950 at 19:50:03Z, de4b2511 at 20:17:33Z, differing in exactly
            # those three fields on exactly the 24 undelivered rows). A
            # different tree is a new commit, a new commit is a force-push, and
            # a force-push restarts a ~19 minute check suite on a 15 minute
            # cadence. The head was almost never a commit with finished checks,
            # so the gate below could never fire. #218 churned that way for
            # three days.
            #
            # So when the router's branch already proposes against this exact
            # main, the importer runs ON TOP OF IT. Rows it already proposed
            # come back DUPLICATE_NOOP and keep their original canonical bytes
            # -- by the importer's own contract, not by anything this router
            # rewrites. Only a genuinely new wager appends. See
            # src/kalshi_router/delivery_branch.py for why that is the honest
            # fix rather than faking or stripping the timestamps.
            #
            # Per-destination, like everything else in this loop: a clone whose
            # branch cannot be read must cost THAT sport its run, not abort the
            # step and take every other destination down with it. stdout is the
            # seed commit, for a caller that wants it; the human-readable line
            # naming it is on stderr and reaches this log either way.
            seed_status=0
            python "${GITHUB_WORKSPACE}/scripts/deliver_branch.py" \
              --work "${work}" --sport "${sport}" --base-sha "${base_sha}" \
              seed >/dev/null || seed_status=$?
            if [ "${seed_status}" -ne 0 ]; then
              echo "::error::${sport}: could not prepare the delivery branch (exit ${seed_status}). Nothing was imported or pushed."
              failures=$((failures + 1))
              continue
            fi

            # The destination's OWN importer, named by its own profile.
            # Never a hand-written ledger edit and never another destination's
            # command: the MLB importer speaks camelCase and reads an envelope
            # batch id, the CFB one speaks snake_case and needs a season, and
            # running either against the other's ledger writes nothing usable.
            receipts="${RUNNER_TEMP}/receipts-${sport}.json"
            mapfile -t import_argv < <(
              python "${GITHUB_WORKSPACE}/scripts/destination_profile.py" "${sport}" \
                --importer wager --payload "${payload}" --work "${work}" \
                --code "${code}" --receipts "${receipts}" \
                ${season:+--season "${season}"}
            )
            if [ ${#import_argv[@]} -eq 0 ]; then
              echo "::error::${sport}: the importer command could not be built."
              failures=$((failures + 1))
              continue
            fi
            import_status=0
            ( cd "${work}" && "${import_argv[@]}" >/dev/null ) || import_status=$?

            # Receipts carry the canonical bet id and the duplicate verdict.
            # Counts and verdicts only -- never the stake or the ticker.
            python "${GITHUB_WORKSPACE}/scripts/report_receipts.py" --receipts "${receipts}"

            # A REFUSED ROW MUST NEVER COST THE ROWS THAT SUCCEEDED.
            #
            # `import_bet_batch.py` states its own contract, and it is not
            # ambiguous: "0 if every row wrote successfully (NEW/DUPLICATE_NOOP/
            # CORRECTED); 1 if any row failed ... the full per-row receipt list
            # is still always printed/written so a partially-successful batch is
            # never silently lossy." Rows are persisted ONE AT A TIME inside
            # process_row via write_placed_bet, so a non-zero exit means A ROW
            # FAILED -- never NOTHING WAS WRITTEN.
            #
            # This loop used to `continue` here, discarding the whole clone. On
            # 2026-09-16 a scheduled run built 17 eligible MLB wagers, the
            # importer wrote 16 as NEW and refused 1 as CONFLICT, and all 16
            # were thrown away: no commit, no branch, no pull request -- and a
            # postmortem the next morning that could not see the night's bets.
            #
            # So the failure is COUNTED (the job still ends red, and the refusal
            # is annotated below) and whatever the importer DID write is still
            # committed and proposed. Those are two separate decisions and both
            # are made on purpose: a partial failure must not become a quiet
            # success, and it must not cost valid rows either.
            partial=0
            if [ "${import_status}" -ne 0 ]; then
              echo "::error::${sport}: the destination importer refused at least one row. Rows it DID write are still being delivered below."
              failures=$((failures + 1))
              partial=1
            fi

            # IDEMPOTENCY IS PROVED EVERY RUN, NOT ASSUMED ONCE.
            #
            # docs/OPERATIONS.md records a sandbox measurement that a
            # byte-identical re-run is a DUPLICATE_NOOP. That sandbox was
            # deleted. The auto-merge gate below will not land a batch on the
            # strength of a measurement nobody can re-run, so the payload is
            # applied a SECOND time, here, to the tree the first import just
            # produced. Every row must come back DUPLICATE_NOOP with the same
            # canonical betId, and the tree must not move.
            #
            # `git write-tree` is the tree comparison: it hashes the staged
            # content, so "did the second import change anything at all" is
            # answered by git rather than by a diff of prose. Staging early is
            # harmless -- the containment check below reads the staged set, and
            # the commit stages the same thing anyway.
            git -C "${work}" add -A
            tree_before_rerun="$(git -C "${work}" write-tree)"
            rerun_receipts="${RUNNER_TEMP}/receipts-rerun-${sport}.json"
            mapfile -t rerun_argv < <(
              python "${GITHUB_WORKSPACE}/scripts/destination_profile.py" "${sport}" \
                --importer wager --payload "${payload}" --work "${work}" \
                --code "${code}" --receipts "${rerun_receipts}" \
                ${season:+--season "${season}"}
            )
            ( cd "${work}" && "${rerun_argv[@]}" >/dev/null ) || true
            git -C "${work}" add -A
            tree_after_rerun="$(git -C "${work}" write-tree)"
            if [ "${tree_before_rerun}" = "${tree_after_rerun}" ]; then
              rerun_changed_tree=false
              echo "  idempotency: a second identical import changed nothing."
            else
              rerun_changed_tree=true
              echo "::error::${sport}: re-applying the IDENTICAL payload changed the ledger. The import is not idempotent; this batch will not auto-merge."
            fi

            # THE DESTINATION'S OWN VERDICT ON ITS OWN DATA.
            #
            # Most destinations answer through pull-request CI. One cannot:
            # GitHub runs a `pull_request` workflow only if that workflow file
            # exists on the pull request's BASE branch, and CFB's base is an
            # ORPHAN data branch with no `.github/` at all -- measured, not
            # assumed: its two backfill pull requests have zero workflow runs
            # between them. A gate that only knew about CI would wait forever
            # for a signal that cannot arrive, and every automatic delivery
            # would sit open.
            #
            # So such a destination supplies the verdict directly: ITS OWN
            # validator, from ITS OWN code branch, run against the tree ITS OWN
            # importer just produced. The router reports the answer and does
            # not form one.
            validator_passed=""
            has_validator="$(python "${GITHUB_WORKSPACE}/scripts/destination_profile.py" \
              "${sport}" --field has_ledger_validator)"
            if [ "${has_validator}" = "true" ]; then
              validator_result="${RUNNER_TEMP}/validator-${sport}.json"
              mapfile -t validator_argv < <(
                python "${GITHUB_WORKSPACE}/scripts/destination_profile.py" "${sport}" \
                  --field ledger_validator
              )
              # Rendered here rather than by --importer, which is for importers.
              rendered=()
              for part in "${validator_argv[@]}"; do
                part="${part//\{code\}/${code}}"
                part="${part//\{work\}/${work}}"
                part="${part//\{receipts\}/${validator_result}}"
                rendered+=("${part}")
              done
              validator_status=0
              "${rendered[@]}" || validator_status=$?
              if [ "${validator_status}" -eq 0 ]; then
                validator_passed="true"
                echo "  the destination's own ledger validator accepted this tree."
              else
                validator_passed="false"
                echo "::error::${sport}: the destination's own ledger validator REFUSED the tree this delivery produced. The rows stay on the branch and will not auto-merge."
                failures=$((failures + 1))
              fi
            fi

            # ADOPT, PUSH, OR NOTHING TO DELIVER -- one decision, made once.
            #
            # `scripts/deliver_branch.py settle` stages what the importer wrote,
            # reshapes it into exactly one commit on top of the destination's
            # main, refuses anything staged outside data/, and then compares the
            # result with the branch the remote already holds. It is the only
            # thing in this workflow that pushes, and every rule it applies
            # lives in src/kalshi_router/delivery_branch.py, which is pure and
            # separately tested -- including against the exact production state
            # this incident produced.
            #
            # This replaces an emptiness test against the WORKING TREE. That
            # test asked "did the importer change anything", which stopped being
            # the right question the moment the importer began running on top of
            # the delivery branch: with the branch already carrying the
            # proposal, a clean tree means the proposal is READY, not that there
            # is nothing to deliver. The question is now asked against main's
            # tree, which is the only thing that can answer it.
            settle_status=0
            action="$(python "${GITHUB_WORKSPACE}/scripts/deliver_branch.py" \
              --work "${work}" --sport "${sport}" --base-sha "${base_sha}" \
              settle --message "Import Kalshi wagers via kalshi-bet-router (${sport})" \
              $([ "${DRY_RUN}" = "true" ] && echo --dry-run))" || settle_status=$?

            case "${settle_status}" in
              0) ;;
              3)
                # The import dirtied files outside the destination's own
                # committable prefixes. `git add -A` is only safe because the
                # destination's .gitignore covers what the importer leaves
                # behind, and that is THEIR property to change. Nothing was
                # committed and nothing was pushed.
                echo "::error::${sport}: the import dirtied files outside this destination's ledger paths -- nothing was committed. See the paths above."
                failures=$((failures + 1))
                continue ;;
              *)
                echo "::error::${sport}: the delivery branch could not be settled (exit ${settle_status}). Nothing was pushed."
                failures=$((failures + 1))
                continue ;;
            esac

            case "${action}" in
              NOTHING_TO_DELIVER)
                if [ "${partial}" -eq 1 ]; then
                  echo "  the importer refused row(s) and wrote nothing; there is nothing to deliver."
                else
                  echo "  no ledger change -- every row was already imported (no-op)."
                fi
                continue ;;
              ADOPT|PUSH) ;;
              *)
                echo "::error::${sport}: the delivery branch reported an unrecognised action '${action}'."
                failures=$((failures + 1))
                continue ;;
            esac

            if [ "${DRY_RUN}" = "true" ]; then
              echo "  DRY RUN: ledger changed, nothing pushed."
              # --stat, and the word is load-bearing: without it this prints the
              # added ledger LINES -- ticker, stake, entry price, source key --
              # into a public Actions log. Against base_sha rather than HEAD so
              # it says the same thing whether this run would have adopted the
              # existing head or pushed a new one.
              git -C "${work}" --no-pager diff --stat "${base_sha}"
              continue
            fi

            if [ "${action}" = "ADOPT" ]; then
              # THE POINT OF THE WHOLE REPAIR. Identical content on an unchanged
              # base keeps the commit that is already there, so the destination's
              # check suite runs ONCE and is allowed to finish.
              echo "  ${branch} already carries this exact content on this base; not pushing."
            else
              echo "  pushed ${branch}"
            fi

            # A BRANCH IS NOT THE LEDGER. Without a pull request the wager sits
            # somewhere nobody looks and is never recorded, which is the one
            # thing this system exists to do. Opening it is therefore part of
            # delivery, not a nicety -- and failing to open it is a failure.
            pr_body="${RUNNER_TEMP}/pr-${sport}.json"
            pr_status="$(curl --silent --show-error --write-out '%{http_code}' \
              --output "${pr_body}" \
              -X POST \
              -H "Authorization: Bearer ${DOWNSTREAM_REPO_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${repo}/pulls" \
              -d "{\"title\":\"Record Kalshi wagers (${sport})\",\"head\":\"${branch}\",\"base\":\"${ledger_branch}\",\"body\":\"Imported by kalshi-bet-router through this repository's own importer. Counts are in the router's run log; the rows are in the diff.\"}")"

            case "${pr_status}" in
              201)
                echo "  opened a pull request" ;;
              422)
                # Already open for this head. Expected on every run after the
                # first, because the branch is long-lived.
                echo "  pull request already open for ${branch}" ;;
              *)
                echo "::error::${sport}: could not open a pull request (HTTP ${pr_status}). The wagers are on ${branch} but are NOT recorded."
                failures=$((failures + 1))
                continue ;;
            esac
            # A PARTIAL DELIVERY MUST NOT READ LIKE A CLEAN ONE. The rows that
            # were written are on the branch and in the pull request above; the
            # refusal is an error annotation and a job-summary line, so it
            # cannot disappear behind a green-looking push.
            if [ "${partial}" -eq 1 ]; then
              echo "::warning::${sport}: DELIVERED PARTIALLY -- the rows above were written and proposed, and at least one row was refused. See the receipts counts."
              echo "${sport}: PARTIAL -- delivered what the importer wrote; at least one row refused" >> "${GITHUB_STEP_SUMMARY}"
            fi

            # A PULL REQUEST IS NOT THE LEDGER EITHER.
            #
            # docs/DELIVERY.md says a branch is not the ledger, and opening a
            # pull request was the answer. It is only half of one: #218 carried
            # 8 MLB wagers from 2026-09-18, stayed open and clean for three
            # days, and the destination's own 2026-09-18 report said
            # "Placed bets: 0" -- because the rows were not on main.
            #
            # THE BASE THE GATE READS IS THE BRANCH'S OWN PARENT, not this
            # run's clone of main. The router keeps the branch at exactly one
            # commit, so its parent IS the commit it proposes against -- which
            # makes a two-dot diff against it the TRUE merge base, readable from
            # a --depth 2 fetch with no deeper history. That is what lets a
            # proposal survive destination commits it does not depend on: what
            # the gate inspects is exactly what merging would apply.
            #
            # The gate is deterministic and lives in
            # src/kalshi_router/automerge.py, which is pure and separately
            # tested. It merges ONLY when every machine-verifiable condition
            # passes on THIS commit: router-owned branch, base main, no
            # importer refusal, no verdict needing judgement, the second
            # identical import proved idempotent above, only the canonical
            # wager ledger changed, the ledger diff is APPEND-ONLY, every added
            # row carries this router's importBatchId and a receipt, the
            # destination's CI is green, and GitHub reports the branch cleanly
            # mergeable.
            #
            # WAIT is the normal state on the run that first pushes a commit
            # (CI is still running) and costs nothing -- the next run adopts
            # the same commit and merges it.
            merge_status=0
            python "${GITHUB_WORKSPACE}/scripts/merge_delivery_pr.py" \
              --sport "${sport}" \
              --work "${work}" \
              --receipts "${receipts}" \
              --rerun-receipts "${rerun_receipts}" \
              --rerun-changed-tree "${rerun_changed_tree}" \
              --partial "$([ "${partial}" -eq 1 ] && echo true || echo false)" \
              ${validator_passed:+--validator-passed "${validator_passed}"} \
              --base-ref "$(git -C "${work}" rev-parse HEAD^)" \
              $([ "${DRY_RUN}" = "true" ] && echo --dry-run) || merge_status=$?

            case "${merge_status}" in
              0) ;;
              3)
                # A condition FAILED. Nothing merged, the rows stay on the
                # branch and in the pull request, and the reason is named
                # above. This is red for the same reason a partial import is
                # red: it needs a person, and the next run will not change it.
                echo "::error::${sport}: the auto-merge gate REFUSED this batch. The rows are delivered and remain on ${branch}; they are NOT on main. See the named condition above."
                echo "${sport}: MERGE REFUSED -- rows delivered to ${branch}, not merged" >> "${GITHUB_STEP_SUMMARY}"
                # A partial import ALREADY counted this destination as failed,
                # and the gate refusing is that same failure seen a second
                # time -- not a second destination going wrong. Counting it
                # twice would make "destinations that failed" stop meaning
                # destinations.
                if [ "${partial}" -eq 0 ]; then
                  failures=$((failures + 1))
                fi
                ;;
              *)
                echo "::error::${sport}: the auto-merge gate could not run (exit ${merge_status})."
                failures=$((failures + 1))
                ;;
            esac
          done

          echo ""
          echo "destinations that failed: ${failures}"
          if [ "${failures}" -ne 0 ]; then
            exit 1
          fi

      - name: Annotate the run's health
        run: |
          set -euo pipefail
          # A REFUSAL IS NOT A FAILURE. This step never fails the job: the one
          # state that asks for a human (BLOCKED) is a correct refusal of a
          # wager this system cannot record, and failing a job every 15 minutes
          # for something only the owner can fix would train them to ignore it.
          # It is a warning and a job summary, which is what "visible" means
          # here.
          case "${HEALTH:-}" in
            healthy_no_op)
              echo "::notice::HEALTHY NO-OP -- no post-cutover activity." ;;
            delivered)
              echo "::notice::DELIVERED -- at least one wager was handed to a destination." ;;
            deferred)
              echo "::notice::DEFERRED -- held by a gate that opens on its own. The next run is the fix." ;;
            not_routable)
              echo "::notice::NOT ROUTABLE -- post-cutover activity this system is designed never to route." ;;
            blocked)
              echo "::warning::BLOCKED -- a wager was placed that this system cannot record, and waiting will not change that. See the refusal counts above." ;;
            *)
              echo "::error::The run reported no health state ('${HEALTH:-}'). That is itself a defect."
              exit 1 ;;
          esac
          echo "health: ${HEALTH:-unknown}" >> "${GITHUB_STEP_SUMMARY}"
