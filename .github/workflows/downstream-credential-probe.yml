# Phase 1: prove the downstream delivery credential works, without using it.
#
# SECURITY NOTES (this repository is public):
#   * Manual dispatch only, main branch only. No schedule, no pull_request, and
#     deliberately no `pull_request_target` -- fork code must never see this
#     secret.
#   * This is the ONLY workflow that receives DOWNSTREAM_REPO_TOKEN. A test
#     asserts the read-only audit workflow does not, and never gains it.
#   * The probe READS repository metadata. It creates no branch, no file, no
#     commit and no pull request, and it never touches canonical wager data.
#     Proving a write credential by writing is the expensive way to find out.
#   * The token is passed as an Authorization HEADER, never in a URL: a URL
#     reaches the server's logs, a proxy's logs and any redirect target.
#   * `set -x` is deliberately absent. Tracing would echo the header.
#   * Only the repository name, the HTTP status and two booleans are printed.
name: Downstream credential probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: downstream-credential-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Probe downstream repository access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse to run credentialed code from an untrusted ref
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::This credentialed workflow may only run from refs/heads/main (got ${GITHUB_REF})."
            exit 1
          fi

      - name: Probe each destination repository
        env:
          DOWNSTREAM_REPO_TOKEN: ${{ secrets.DOWNSTREAM_REPO_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${DOWNSTREAM_REPO_TOKEN}" ]; then
            echo "::error::DOWNSTREAM_REPO_TOKEN is not set on this repository."
            exit 1
          fi

          # Length only. Never the value, never a prefix, never a suffix -- a
          # prefix identifies the token type and a suffix narrows a brute force.
          echo "credential present: true (length ${#DOWNSTREAM_REPO_TOKEN})"
          echo ""

          failures=0
          for repo in \
            chmoses98/edge-finder-api \
            chmoses98/nfl-edge-finder \
            chmoses98/cfb-edge-finder \
            chmoses98/Tennis-Edge-Finder
          do
            body="$(mktemp)"
            status="$(curl --silent --show-error \
              --write-out '%{http_code}' \
              --output "${body}" \
              -H "Authorization: Bearer ${DOWNSTREAM_REPO_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${repo}")"

            # jq, not grep: a substring match on the body would happily find
            # "push": true inside some unrelated field and report access the
            # token does not have.
            push="$(jq -r '.permissions.push // false' < "${body}" 2>/dev/null || echo "unreadable")"
            pull="$(jq -r '.permissions.pull // false' < "${body}" 2>/dev/null || echo "unreadable")"
            rm -f "${body}"

            echo "${repo}"
            echo "  http status: ${status}"
            echo "  read access:  ${pull}"
            echo "  write access: ${push}"

            if [ "${status}" != "200" ] || [ "${push}" != "true" ]; then
              echo "  RESULT: NOT USABLE for delivery"
              failures=$((failures + 1))
            else
              echo "  RESULT: usable for delivery"
            fi
            echo ""
          done

          echo "destinations not usable: ${failures}"
          if [ "${failures}" -ne 0 ]; then
            echo "::error::One or more destinations are not reachable with write access."
            exit 1
          fi
          echo "All four destinations are reachable with write access."
