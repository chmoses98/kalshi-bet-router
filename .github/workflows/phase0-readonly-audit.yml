# Phase 0 credentialed audit.
#
# SECURITY NOTES (this repository is public):
#   * Manual dispatch only. There is no schedule, no `pull_request`, and
#     deliberately no `pull_request_target` -- fork code must never see these
#     secrets.
#   * `permissions: contents: read` only. The audit writes nothing: no commit,
#     no artifact, no cache, no downstream dispatch.
#   * The job prints aggregate counts only. The `--show-sensitive-details` flag
#     is absent here and would refuse to run anyway, because the CLI hard-fails
#     when it detects GITHUB_ACTIONS (see kalshi_router/safety.py).
#   * Secrets are passed as env vars to a single step and are never echoed,
#     written to a file, or passed on a command line.
name: Phase 0 read-only audit

on:
  workflow_dispatch:
    inputs:
      max_fills:
        description: "Bounded recent fill sample size (1-500). Ignored when full_history is set"
        required: false
        default: "200"
      reconcile:
        description: "Also measure the replay against the exchange's positions and settlements"
        required: false
        type: boolean
        default: false
      full_history:
        description: "Walk BOTH fill routes to exhaustion (ignores max_fills) so a COMPLETE history can be claimed"
        required: false
        type: boolean
        default: false
      max_classify_markets:
        description: "Cap the metadata sweep (accounting still replays every fill). Blank = no cap"
        required: false
        default: ""
      shadow_wagers:
        description: "Build the canonical wager rows a router WOULD send, and send none of them"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: phase0-readonly-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Aggregate read-only audit
    runs-on: ubuntu-latest
    # Classifying every routable market costs several metadata requests each,
    # and a complete history touches ~1700 markets. Ten minutes was enough only
    # while the sweep was bounded to a few hundred; it is not enough to classify
    # the whole routable set, and a run that dies at the cap produces a bounded
    # answer that LOOKS like a complete one.
    timeout-minutes: 30
    steps:
      - name: Refuse to run credentialed code from an untrusted ref
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::This credentialed workflow may only run from refs/heads/main (got ${GITHUB_REF})."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install --disable-pip-version-check --quiet .

      - name: Run privacy-safe aggregate audit
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          MAX_FILLS: ${{ inputs.max_fills }}
          RECONCILE: ${{ inputs.reconcile }}
          FULL_HISTORY: ${{ inputs.full_history }}
          MAX_CLASSIFY: ${{ inputs.max_classify_markets }}
          SHADOW_WAGERS: ${{ inputs.shadow_wagers }}
        run: |
          set -euo pipefail
          FLAGS=""
          if [ "${RECONCILE}" = "true" ]; then
            FLAGS="${FLAGS} --reconcile"
          fi
          if [ "${FULL_HISTORY}" = "true" ]; then
            FLAGS="${FLAGS} --full-history"
          fi
          if [ "${SHADOW_WAGERS}" = "true" ]; then
            FLAGS="${FLAGS} --shadow-wagers"
          fi
          if [ -n "${MAX_CLASSIFY}" ]; then
            FLAGS="${FLAGS} --max-classify-markets ${MAX_CLASSIFY}"
          fi
          python -m kalshi_router.cli audit --max-fills "${MAX_FILLS}" ${FLAGS}
          echo "Audit completed. Exit code 0 covers a successful audit of an"
          echo "account with no fills; an API or schema failure exits non-zero."
