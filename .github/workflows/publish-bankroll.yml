# Publish the account's current available cash to the MLB handicapper.
#
# WHY A SECRET AND NOT A FILE, AN ARTIFACT OR A LOG LINE
# ------------------------------------------------------
# BOTH repositories in this system are PUBLIC:
#
#   chmoses98/kalshi-bet-router   public
#   chmoses98/edge-finder-api     public
#
# On a public repository, workflow logs, job summaries and uploaded
# artifacts are readable by anyone on the internet, with no login. So
# every obvious delivery mechanism publishes the owner's bank balance to
# the world:
#
#   commit it to either repo   -> public, and public forever in history
#   upload it as an artifact   -> public download link
#   echo it into the job log   -> public
#   put it in a job summary    -> public
#
# GitHub Actions SECRETS are the one channel in this architecture that is
# not. A secret is sealed client-side with libsodium against the
# destination repository's Actions public key, is never readable back out
# through the API (the REST API exposes no plaintext read), and is
# decrypted only inside a workflow run of that repository. That is
# exactly the shape this needs: the destination's CARD BUILD can use the
# number, and nobody reading the destination repository can.
#
# So the balance travels router -> (sealed) -> edge-finder-api secret ->
# that repo's card-build workflow, and the card that gets COMMITTED
# carries the bankroll's status, age, source and semantics but not its
# value. See docs/BANKROLL_DELIVERY.md.
#
# SCOPE OF THE CREDENTIAL WIDENING
# --------------------------------
# This job reads GET /portfolio/balance and nothing else. The Kalshi
# client has no order, cancel, amend, withdraw, deposit or transfer
# capability, and those routes are pinned unreachable by tests
# (tests/test_client.py::TRADING_ROUTES). Reading the balance is not
# permission to trade, and nothing here grants it.
name: Publish bankroll to the handicapper

on:
  # Matches the 30-minute freshness window the destination enforces, with
  # headroom for a delayed scheduled run. A balance older than that window
  # does not produce a wrong stake size -- it produces no stake size.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Last writer wins, and the newest reading is the one worth having.
  group: publish-bankroll
  cancel-in-progress: true

jobs:
  publish:
    name: Read balance, seal it into the destination
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refuse to run credentialed code from an untrusted ref
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::This credentialed workflow may only run from refs/heads/main (got ${GITHUB_REF})."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install router
        run: python -m pip install --disable-pip-version-check --quiet . pynacl

      # THE CREDENTIAL IS CHECKED BEFORE THE ACCOUNT IS TOUCHED.
      #
      # Every scheduled run from 2026-09-18 onward read a live balance from
      # the owner's Kalshi account and then discovered it had no way to
      # deliver it, because DOWNSTREAM_SECRETS_TOKEN does not exist on this
      # repository. A credentialed read whose result is thrown away is not
      # free, and it is not something to do on a fifteen-minute timer.
      #
      # The preflight makes ONE read-only request -- the destination's
      # Actions public key -- which is exactly the capability the seal
      # needs. A token that passes here can seal; a token that fails here
      # never could have.
      - name: Verify the delivery credential (no account is read yet)
        id: preflight
        env:
          DOWNSTREAM_SECRETS_TOKEN: ${{ secrets.DOWNSTREAM_SECRETS_TOKEN }}
          DESTINATION_REPO: chmoses98/edge-finder-api
          DESTINATION_SECRET: KALSHI_BANKROLL_CONTEXT
        run: |
          set -euo pipefail
          status=0
          python "${GITHUB_WORKSPACE}/scripts/publish_bankroll_secret.py" \
            --preflight-only \
            --repo "${DESTINATION_REPO}" \
            --secret-name "${DESTINATION_SECRET}" || status=$?
          case "${status}" in
            0) ;;
            3)
              echo "::error::The bankroll publisher cannot deliver: DOWNSTREAM_SECRETS_TOKEN is missing or is not scoped to ${DESTINATION_REPO} with 'Secrets: Read and write'. NOTHING was read from the Kalshi account this run. Create that fine-grained PAT and store it as the Actions secret DOWNSTREAM_SECRETS_TOKEN on this repository -- it is deliberately NOT the delivery token, because writing a secret and pushing a branch are different powers. Until then the handicapping card reports the bankroll as unavailable and presents no dollar stake sizes, which is the correct degraded behaviour."
              exit 3 ;;
            *)
              echo "::error::The bankroll publisher could not reach the GitHub API (exit ${status}). No account was read. This is transient; the next scheduled run retries."
              exit "${status}" ;;
          esac

      - name: Read the balance
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # RUNNER_TEMP, never the workspace: a file in the workspace can be
          # picked up by a later `git add -A` in some future edit of this
          # workflow. The runner is destroyed with the job.
          python -m kalshi_router.cli bankroll --out "${RUNNER_TEMP}/bankroll.json"

      # The seal now also VERIFIES: after the write, the destination's
      # secret metadata (name and updated_at -- never its value, which the
      # REST API does not expose) must show this run's write. A 204 proves a
      # request was accepted, not that the destination holds anything.
      - name: Seal it into the destination repository
        env:
          DOWNSTREAM_SECRETS_TOKEN: ${{ secrets.DOWNSTREAM_SECRETS_TOKEN }}
          DESTINATION_REPO: chmoses98/edge-finder-api
          DESTINATION_SECRET: KALSHI_BANKROLL_CONTEXT
        run: |
          set -euo pipefail
          status=0
          python "${GITHUB_WORKSPACE}/scripts/publish_bankroll_secret.py" \
            --context "${RUNNER_TEMP}/bankroll.json" \
            --repo "${DESTINATION_REPO}" \
            --secret-name "${DESTINATION_SECRET}" || status=$?
          case "${status}" in
            0) ;;
            2) echo "::error::The bankroll context this run produced was REFUSED before sending. The reason is named above and carries no amount -- most likely the value is not ${DESTINATION_SECRET}'s required KALSHI_AVAILABLE_CASH_BALANCE, or the reading is already past the destination's 30-minute window." ;;
            3) echo "::error::DOWNSTREAM_SECRETS_TOKEN lost its 'Secrets: Read and write' access to ${DESTINATION_REPO} between the preflight and the write." ;;
            5) echo "::error::The write was ACCEPTED but ${DESTINATION_SECRET} on ${DESTINATION_REPO} does not show it. Do not treat this run as a successful publication." ;;
            *) echo "::error::The bankroll could not be sealed (exit ${status})." ;;
          esac
          exit "${status}"

      - name: Report (shape only, never the amount)
        if: always()
        run: |
          set -euo pipefail
          if [ -f "${RUNNER_TEMP}/bankroll.json" ]; then
            python - "${RUNNER_TEMP}/bankroll.json" <<'PYEOF'
          import json, sys
          ctx = json.load(open(sys.argv[1]))
          # Keys and non-monetary values only. `bankroll` is never read here.
          print(f"observedAt: {ctx['observedAt']}")
          print(f"valueType:  {ctx['valueType']}")
          print(f"source:     {ctx['source']}")
          print(f"currency:   {ctx['currency']}")
          print("amount:     ***withheld*** (this repository is public)")
          PYEOF
          else
            echo "no bankroll context was produced this run"
          fi
