# Phase 12: recovery. Re-deliver after an outage, and -- only if the owner says
# so in words -- import pre-cutover history.
#
# WHY THIS IS A SEPARATE WORKFLOW FROM THE SCHEDULED ONE
#   The scheduled delivery must never be able to import history. Keeping the
#   pre-cutover input out of that workflow entirely is stronger than defaulting
#   it off there: an input that does not exist cannot be set by a mistyped
#   dispatch, and a test asserts the scheduled workflow does not name it.
#
# WHY RE-RUNNING IS SAFE
#   The source key is derived from (subaccount, ticker, order id) alone -- no
#   time, no run id, no batch position. So a wager already delivered lands on
#   the same betId, and the destination's importer answers DUPLICATE_NOOP and
#   writes nothing. Measured against the real importer, not assumed: a first
#   import took the ledger 457 -> 458, a byte-identical re-import left it at
#   458 with the same betId, and the same key with a changed stake was refused
#   as CONFLICT with nothing written.
#
# SECURITY: identical posture to the scheduled delivery -- payload to
# RUNNER_TEMP, never printed, never uploaded; the credential reaches git only
# through a helper that reads it from the environment at push time.
name: Recover wagers

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and import locally, then discard without pushing"
        required: false
        type: boolean
        default: true
      include_pre_cutover:
        description: >-
          RECOVERY ONLY. To import orders from BEFORE the production cutover,
          type exactly: I have decided to import pre-cutover history
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # Shares the delivery group: a recovery run and a scheduled delivery must
  # never build payloads from the same account at the same time, and neither
  # may be cancelled mid-delivery.
  group: deliver-wagers
  cancel-in-progress: false

jobs:
  recover:
    name: Recover and deliver
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Refuse to run credentialed code from an untrusted ref
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::This credentialed workflow may only run from refs/heads/main (got ${GITHUB_REF})."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install router
        run: python -m pip install --disable-pip-version-check --quiet .

      - name: Build the recovery payload
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          INCLUDE_PRE_CUTOVER: ${{ inputs.include_pre_cutover }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/payloads"

          args=(--out-dir "${RUNNER_TEMP}/payloads" --allow-stabilization)
          if [ -n "${INCLUDE_PRE_CUTOVER}" ]; then
            # The CLI checks the phrase itself and refuses anything else, so a
            # typo fails loudly here rather than quietly doing the normal thing.
            echo "::warning::Pre-cutover history requested. This run may import wagers the destination already holds."
            args+=(--include-pre-cutover "${INCLUDE_PRE_CUTOVER}")
          else
            echo "pre-cutover history: NOT requested (the normal case)."
          fi

          python -m kalshi_router.cli deliver "${args[@]}"

      - name: Deliver each destination
        env:
          DOWNSTREAM_REPO_TOKEN: ${{ secrets.DOWNSTREAM_REPO_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          # Fail closed on an unreadable choice. An empty DRY_RUN must never be
          # read as "go ahead and push" by falling through a != "true" test.
          case "${DRY_RUN}" in
            true|false) ;;
            *)
              echo "::error::DRY_RUN must be exactly 'true' or 'false' (got '${DRY_RUN}')."
              exit 1
              ;;
          esac

          shopt -s nullglob
          payloads=("${RUNNER_TEMP}"/payloads/*.json)
          if [ ${#payloads[@]} -eq 0 ]; then
            echo "HEALTHY NO-OP: nothing eligible for recovery."
            exit 0
          fi

          failures=0
          for payload in "${payloads[@]}"; do
            sport="$(basename "${payload}" .json)"
            case "${sport}" in
              MLB) repo="chmoses98/edge-finder-api" ;;
              *)
                echo "::error::${sport} has no configured destination repository."
                failures=$((failures + 1))
                continue
                ;;
            esac

            echo "=== ${sport} -> ${repo} ==="
            work="${RUNNER_TEMP}/dest-${sport}"
            rm -rf "${work}"
            git clone --quiet --depth 1 "https://github.com/${repo}" "${work}"

            git -C "${work}" config credential.helper \
              '!f() { echo "username=x-access-token"; echo "password=${DOWNSTREAM_REPO_TOKEN}"; }; f'
            git -C "${work}" config user.name "kalshi-bet-router"
            git -C "${work}" config user.email "noreply@users.noreply.github.com"

            # The importer's stdout carries the receipts, which name markets and
            # stakes. It goes to /dev/null; its stderr is counts only.
            receipts="${RUNNER_TEMP}/receipts-${sport}.json"
            import_status=0
            ( cd "${work}" && python scripts/edgelab/import_bet_batch.py \
                --file "${payload}" --receipts-out "${receipts}" >/dev/null ) || import_status=$?

            python - "${receipts}" <<'PYEOF'
          import json, sys
          rows = json.load(open(sys.argv[1]))
          verdicts = {}
          for row in rows:
              verdicts[row.get("duplicateStatus")] = verdicts.get(row.get("duplicateStatus"), 0) + 1
          print(f"  rows: {len(rows)}")
          for verdict, count in sorted(verdicts.items(), key=lambda kv: str(kv[0])):
              print(f"    {verdict}: {count}")
          print(f"  canonical bet ids returned: {sum(1 for r in rows if r.get('betId'))}")
          print(f"  failed rows: {sum(1 for r in rows if not r.get('success'))}")
          PYEOF

            if [ "${import_status}" -ne 0 ]; then
              echo "::error::${sport}: the destination importer refused at least one row."
              failures=$((failures + 1))
              continue
            fi

            if [ -z "$(git -C "${work}" status --porcelain)" ]; then
              echo "  no ledger change -- every row was already imported (no-op)."
              continue
            fi

            if [ "${DRY_RUN}" = "true" ]; then
              echo "  DRY RUN: ledger changed, nothing pushed."
              git -C "${work}" --no-pager diff --stat
              continue
            fi

            branch="kalshi-router/recover-${sport}-$(git -C "${work}" rev-parse --short HEAD)"
            git -C "${work}" checkout -q -b "${branch}"
            git -C "${work}" add -A
            git -C "${work}" commit -q -m "Recover Kalshi wagers via kalshi-bet-router (${sport})"
            git -C "${work}" push -q --set-upstream origin "${branch}"
            echo "  pushed ${branch}"
            echo "  destination commit: $(git -C "${work}" rev-parse HEAD)"
          done

          echo ""
          echo "destinations that failed: ${failures}"
          if [ "${failures}" -ne 0 ]; then
            exit 1
          fi
