# Phase 12: recovery. Re-deliver after an outage, and -- only if the owner says
# so in words -- import pre-cutover history.
#
# WHY THIS IS A SEPARATE WORKFLOW FROM THE SCHEDULED ONE
#   The scheduled delivery must never be able to import history. Keeping the
#   pre-cutover input out of that workflow entirely is stronger than defaulting
#   it off there: an input that does not exist cannot be set by a mistyped
#   dispatch, and a test asserts the scheduled workflow does not name it.
#
# WHY RE-RUNNING IS SAFE
#   The source key is derived from (subaccount, ticker, order id) alone -- no
#   time, no run id, no batch position. So a wager already delivered lands on
#   the same betId, and the destination's importer answers DUPLICATE_NOOP and
#   writes nothing. Measured against the real importer, not assumed: a first
#   import took the ledger 457 -> 458, a byte-identical re-import left it at
#   458 with the same betId, and the same key with a changed stake was refused
#   as CONFLICT with nothing written.
#
# SECURITY: identical posture to the scheduled delivery -- payload to
# RUNNER_TEMP, never printed, never uploaded; the credential reaches git only
# through a helper that reads it from the environment at push time.
name: Recover wagers

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and import locally, then discard without pushing"
        required: false
        type: boolean
        default: true
      include_pre_cutover:
        description: >-
          RECOVERY ONLY. To import orders from BEFORE the production cutover,
          type exactly: I have decided to import pre-cutover history
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # Shares the delivery group: a recovery run and a scheduled delivery must
  # never build payloads from the same account at the same time, and neither
  # may be cancelled mid-delivery.
  group: deliver-wagers
  cancel-in-progress: false

jobs:
  recover:
    name: Recover and deliver
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Refuse to run credentialed code from an untrusted ref
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::This credentialed workflow may only run from refs/heads/main (got ${GITHUB_REF})."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install router
        run: python -m pip install --disable-pip-version-check --quiet .

      - name: Build the recovery payload
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          INCLUDE_PRE_CUTOVER: ${{ inputs.include_pre_cutover }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/payloads"

          args=(--out-dir "${RUNNER_TEMP}/payloads" --allow-stabilization)
          if [ -n "${INCLUDE_PRE_CUTOVER}" ]; then
            # The CLI checks the phrase itself and refuses anything else, so a
            # typo fails loudly here rather than quietly doing the normal thing.
            echo "::warning::Pre-cutover history requested. This run may import wagers the destination already holds."
            args+=(--include-pre-cutover "${INCLUDE_PRE_CUTOVER}")
          else
            echo "pre-cutover history: NOT requested (the normal case)."
          fi

          python -m kalshi_router.cli deliver "${args[@]}" \
            | tee "${RUNNER_TEMP}/report.txt"
          grep -E '^HEALTH=' "${RUNNER_TEMP}/report.txt" >> "${GITHUB_ENV}"

      - name: Deliver each destination
        env:
          DOWNSTREAM_REPO_TOKEN: ${{ secrets.DOWNSTREAM_REPO_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          # Fail closed on an unreadable choice. An empty DRY_RUN must never be
          # read as "go ahead and push" by falling through a != "true" test.
          case "${DRY_RUN}" in
            true|false) ;;
            *)
              echo "::error::DRY_RUN must be exactly 'true' or 'false' (got '${DRY_RUN}')."
              exit 1
              ;;
          esac

          shopt -s nullglob
          payloads=("${RUNNER_TEMP}"/payloads/*.json)
          if [ ${#payloads[@]} -eq 0 ]; then
            # "No payload" is not a health verdict. It can mean a quiet
            # account OR a wager this system refused to record, and this
            # step cannot tell them apart -- the health annotation below
            # can, and it is the one that says which.
            echo "no payload: nothing was eligible for recovery this run."
            exit 0
          fi

          failures=0
          for payload in "${payloads[@]}"; do
            sport="$(basename "${payload}" .json)"
            case "${sport}" in
              MLB) repo="chmoses98/edge-finder-api" ;;
              *)
                echo "::error::${sport} has no configured destination repository."
                failures=$((failures + 1))
                continue
                ;;
            esac

            echo "=== ${sport} -> ${repo} ==="
            work="${RUNNER_TEMP}/dest-${sport}"
            rm -rf "${work}"
            git clone --quiet --depth 1 "https://github.com/${repo}" "${work}"

            git -C "${work}" config credential.helper \
              '!f() { echo "username=x-access-token"; echo "password=${DOWNSTREAM_REPO_TOKEN}"; }; f'
            git -C "${work}" config user.name "kalshi-bet-router"
            git -C "${work}" config user.email "noreply@users.noreply.github.com"

            # The importer's stdout carries the receipts, which name markets and
            # stakes. It goes to /dev/null; its stderr is counts only.
            receipts="${RUNNER_TEMP}/receipts-${sport}.json"
            import_status=0
            ( cd "${work}" && python scripts/edgelab/import_bet_batch.py \
                --file "${payload}" --receipts-out "${receipts}" >/dev/null ) || import_status=$?

            python - "${receipts}" <<'PYEOF'
          import json, sys
          rows = json.load(open(sys.argv[1]))
          verdicts = {}
          for row in rows:
              verdicts[row.get("duplicateStatus")] = verdicts.get(row.get("duplicateStatus"), 0) + 1
          print(f"  rows: {len(rows)}")
          for verdict, count in sorted(verdicts.items(), key=lambda kv: str(kv[0])):
              print(f"    {verdict}: {count}")
          print(f"  canonical bet ids returned: {sum(1 for r in rows if r.get('betId'))}")
          print(f"  failed rows: {sum(1 for r in rows if not r.get('success'))}")
          PYEOF

            if [ "${import_status}" -ne 0 ]; then
              echo "::error::${sport}: the destination importer refused at least one row."
              failures=$((failures + 1))
              continue
            fi

            if [ -z "$(git -C "${work}" status --porcelain)" ]; then
              echo "  no ledger change -- every row was already imported (no-op)."
              continue
            fi

            if [ "${DRY_RUN}" = "true" ]; then
              echo "  DRY RUN: ledger changed, nothing pushed."
              git -C "${work}" --no-pager diff --stat
              continue
            fi

            # ONE LONG-LIVED BRANCH PER SPORT, and one pull request on it.
            #
            # The first version of this derived the branch name from the
            # DESTINATION's HEAD, which moves. Same undelivered wager, two
            # destination commits, two branches -- and because the branch is
            # never merged, every run re-imports as NEW. If the destination
            # had NOT moved it was worse: the same branch name with a
            # different commit, rejected non-fast-forward, red every 15
            # minutes.
            #
            # A stable name fixes both. Each run rebuilds the branch from the
            # destination's current main and re-runs the importer, so the
            # branch always holds exactly "main + everything not yet
            # recorded". The import is deterministic and idempotent, so that
            # content is a function of the account, not of when the job ran.
            branch="kalshi-router/recover-${sport}"

            git -C "${work}" checkout -q -b "${branch}"
            git -C "${work}" add -A

            # WHAT GOES INTO SOMEONE ELSE'S REPOSITORY IS CHECKED, NOT ASSUMED.
            #
            # `git add -A` is safe here only because the destination's own
            # .gitignore covers what the importer leaves behind -- measured on
            # a real clone, it creates three __pycache__ directories and a
            # bets.jsonl.lock, and ignores all of them. That is a property of
            # THEIR repository, which can change without anyone telling this
            # workflow.
            #
            # So: a router-authored commit may only touch data/. A lock file or
            # a .pyc appearing in one means something changed upstream, and
            # stopping is far better than quietly committing it every 15
            # minutes.
            staged="$(git -C "${work}" diff --cached --name-only)"
            unexpected="$(printf '%s\n' "${staged}" | grep -v '^data/' || true)"
            if [ -n "${unexpected}" ]; then
              echo "::error::${sport}: the import dirtied files outside data/ -- refusing to commit them:"
              printf '%s\n' "${unexpected}"
              failures=$((failures + 1))
              continue
            fi

            git -C "${work}" commit -q -m "Recover Kalshi wagers via kalshi-bet-router (${sport})"

            # THE LEASE NEEDS AN EXPLICIT EXPECTED VALUE HERE, and getting
            # this wrong fails from the SECOND run onward rather than the
            # first -- so it would have looked fine exactly once.
            #
            # A --depth 1 clone is SINGLE-BRANCH: its refspec is
            # +refs/heads/main:refs/remotes/origin/main and nothing else. So
            # there is no remote-tracking ref for the router's own branch, a
            # bare --force-with-lease has nothing to form a lease against, and
            # git rejects the push as "stale info".
            #
            # Fetching the branch is necessary and NOT sufficient: even with
            # the remote-tracking ref present, the lease still cannot infer an
            # expected value for a local branch with no configured upstream.
            # Both of those were measured against a real shallow clone, and the
            # first attempted fix (fetch alone) was observed to still fail.
            #
            # So the expectation is stated outright. An EMPTY value means "the
            # branch must not exist yet", which is the first run.
            #
            # --verify --quiet IS LOAD-BEARING. A bare `git rev-parse
            # <missing-ref>` ECHOES ITS ARGUMENT TO STDOUT before failing, so
            # `expected` becomes the literal ref name and the push dies with
            # "cannot parse expected object name" (exit 129). That is exactly
            # how the scheduled delivery of 2026-09-15T16:43Z lost a wager the
            # importer had already accepted, and this file carried the same
            # line. The `|| echo ""` does not help: rev-parse has already
            # written to stdout by the time it runs.
            git -C "${work}" fetch -q --depth 1 origin \
              "+refs/heads/${branch}:refs/remotes/origin/${branch}" || true
            expected="$(git -C "${work}" rev-parse --verify --quiet "refs/remotes/origin/${branch}" || echo "")"

            # ONLY onto this router-owned branch: it is rebuilt from main every
            # run, so its previous tip is this job's own earlier output. The
            # lease still refuses if anything else moved it -- verified by
            # having a second clone push in between.
            git -C "${work}" push -q \
              --force-with-lease="refs/heads/${branch}:${expected}" \
              origin "HEAD:refs/heads/${branch}"
            echo "  pushed ${branch}"
            echo "  destination commit: $(git -C "${work}" rev-parse HEAD)"

            # A BRANCH IS NOT THE LEDGER. Without a pull request the wager sits
            # somewhere nobody looks and is never recorded, which is the one
            # thing this system exists to do. Opening it is therefore part of
            # delivery, not a nicety -- and failing to open it is a failure.
            pr_body="${RUNNER_TEMP}/pr-${sport}.json"
            pr_status="$(curl --silent --show-error --write-out '%{http_code}' \
              --output "${pr_body}" \
              -X POST \
              -H "Authorization: Bearer ${DOWNSTREAM_REPO_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${repo}/pulls" \
              -d "{\"title\":\"Recover Kalshi wagers (${sport})\",\"head\":\"${branch}\",\"base\":\"main\",\"body\":\"Imported by kalshi-bet-router through this repository's own importer. Counts are in the router's run log; the rows are in the diff.\"}")"

            case "${pr_status}" in
              201)
                echo "  opened a pull request" ;;
              422)
                # Already open for this head. Expected on every run after the
                # first, because the branch is long-lived.
                echo "  pull request already open for ${branch}" ;;
              *)
                echo "::error::${sport}: could not open a pull request (HTTP ${pr_status}). The wagers are on ${branch} but are NOT recorded."
                failures=$((failures + 1))
                continue ;;
            esac
          done

          echo ""
          echo "destinations that failed: ${failures}"
          if [ "${failures}" -ne 0 ]; then
            exit 1
          fi

      - name: Annotate the run's health
        run: |
          set -euo pipefail
          # A REFUSAL IS NOT A FAILURE. This step never fails the job: the one
          # state that asks for a human (BLOCKED) is a correct refusal of a
          # wager this system cannot record, and failing a job every 15 minutes
          # for something only the owner can fix would train them to ignore it.
          # It is a warning and a job summary, which is what "visible" means
          # here.
          case "${HEALTH:-}" in
            healthy_no_op)
              echo "::notice::HEALTHY NO-OP -- no post-cutover activity." ;;
            delivered)
              echo "::notice::DELIVERED -- at least one wager was handed to a destination." ;;
            deferred)
              echo "::notice::DEFERRED -- held by a gate that opens on its own. The next run is the fix." ;;
            not_routable)
              echo "::notice::NOT ROUTABLE -- post-cutover activity this system is designed never to route." ;;
            blocked)
              echo "::warning::BLOCKED -- a wager was placed that this system cannot record, and waiting will not change that. See the refusal counts above." ;;
            *)
              echo "::error::The run reported no health state ('${HEALTH:-}'). That is itself a defect."
              exit 1 ;;
          esac
          echo "health: ${HEALTH:-unknown}" >> "${GITHUB_STEP_SUMMARY}"
