# READ-ONLY closing-price coverage (aggregate counts only).
#
# SECURITY NOTES (this repository is public):
#   * Manual dispatch only, from refs/heads/main only. No schedule, no pull_request, no pull_request_target.
#   * `permissions: contents: read`. Writes nothing: no commit, no artifact, no cache, no downstream dispatch.
#   * Prints COUNTS ONLY (true close / earlier-quote proxy / missing / no cutoff). The report has no field that can
#     hold a ticker, price, time or id.
#   * It reads the account's fills for the set of traded markets, then the exchange's public market, event and
#     candlestick routes. It is the live verification of kalshi_router.closes, whose parser was written against the
#     documented response shape without live access.
name: Resolve closes (read-only coverage)

on:
  workflow_dispatch:
    inputs:
      max_fills:
        description: "Bounded recent fill sample (1-2000)"
        required: false
        default: "500"
      prefix:
        description: "Only markets whose ticker starts with this, e.g. KXNCAAF or KXNFL (blank = all)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: resolve-closes
  cancel-in-progress: false

jobs:
  closes:
    name: Aggregate close coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Refuse to run credentialed code from an untrusted ref
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::This credentialed workflow may only run from refs/heads/main (got ${GITHUB_REF})."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install --disable-pip-version-check --quiet .

      - name: Count true closes, proxies and missing closes
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          MAX_FILLS: ${{ inputs.max_fills }}
          PREFIX: ${{ inputs.prefix }}
        run: |
          set -euo pipefail
          FLAGS=""
          if [ -n "${PREFIX}" ]; then
            FLAGS="--prefix ${PREFIX}"
          fi
          python -m kalshi_router.cli closes --max-fills "${MAX_FILLS}" ${FLAGS}
