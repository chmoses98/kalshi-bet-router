[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-bet-router"
version = "0.1.0"
description = "Phase 0: read-only Kalshi fill ingestion and sport classification"
requires-python = ">=3.11"
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest>=7", "PyYAML>=6"]

[project.scripts]
kalshi-router = "kalshi_router.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
