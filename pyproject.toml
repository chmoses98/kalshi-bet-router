[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-bet-router"
version = "0.1.0"
description = "Phase 0: read-only Kalshi fill ingestion and sport classification"
requires-python = ">=3.11"
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
# pynacl is a TEST dependency as well as a runtime one for
# scripts/publish_bankroll_secret.py. tests/test_bankroll_publisher_repair.py
# seals against a real libsodium keypair and DECRYPTS the result, so
# "sealing succeeds" is a decryption the suite performs rather than a status
# code it believes. Without it that proof would quietly not run.
dev = ["pytest>=7", "PyYAML>=6", "PyNaCl>=1.5"]

[project.scripts]
kalshi-router = "kalshi_router.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
